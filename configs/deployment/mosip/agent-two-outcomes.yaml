task:
  objective: >-
    Begin deploying MOSIP on the supplied Kubernetes cluster. Read the live state
    and the supplied deployment repositories to identify what is already available,
    what the supported deployment requires next, and the next missing capability
    that can safely close that gap. Deploy and validate two distinct missing
    capabilities or components; do not count preparatory commands or resources
    already present. Verify required Kubernetes infrastructure before installing
    external dependencies. If storage is required but absent, investigate the
    supported in-cluster storage routes before attempting its consumers. Ask the
    human to choose only if multiple supported routes remain viable. Do not
    create or change AWS resources, delete data, or switch Kubernetes contexts.
  stop_after_verified_outcomes: 2

sources:
  repositories:
    - location: https://github.com/mosip/k8s-infra.git
      revision: 1f6253d5855cee6f2a10a761feef3f50c0c29cdd
    - location: https://github.com/mosip/mosip-infra.git
      revision: 73e158af0b48a27bd777bb82dfb447259921834b

environment:
  type: kubernetes
  context: mosip

constraints:
  allow_new_infrastructure: true
  allow_destructive_actions: false
  allowed_namespaces: ["*"]

budgets:
  max_cycles: 20
  max_mutating_actions: 8
  max_runtime_minutes: 180
  max_read_actions_per_cycle: 12
