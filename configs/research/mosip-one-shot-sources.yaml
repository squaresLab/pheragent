system: mosip

# One-shot treatment: complete initial-deployment files, without retrieval or chunking.
sources:
  - id: mosip-infra
    kind: git
    location: https://github.com/mosip/mosip-infra.git
    purpose: repository
    revision: v1.2.1.0
    root_path: .
    include_patterns:
      - README*
      - deployment/v3/**
    exclude_patterns:
      - "**/.git/**"
      - "**/node_modules/**"
      - "**/vendor/**"
      - "**/dist/**"
      - "**/build/**"
      - "**/target/**"
      - "**/upgrade/**"
      - "**/test/**"
      - "**/tests/**"
      - "**/*.json"
      - "**/*.lock"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.gif"
      - "**/*.pdf"
      - "**/*.zip"
      - "**/*.tar"
      - "**/*.gz"

