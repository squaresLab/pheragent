<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Progressive deployment: failure trajectories</title>
  <desc id="desc">Three concise trajectories showing an aggregate installer conflict, an interactive script timeout, and an unbounded source-search loop.</desc>
  <defs>
    <style>
      .title{font:700 39px Inter,Arial,sans-serif;fill:#111827}.subtitle{font:19px Inter,Arial,sans-serif;fill:#475569}
      .panel-title{font:700 26px Inter,Arial,sans-serif;fill:#111827}.task{font:700 18px Inter,Arial,sans-serif;fill:#111827}
      .label{font:700 17px Inter,Arial,sans-serif;fill:#1e3a8a}.body{font:17px Inter,Arial,sans-serif;fill:#1f2937}
      .mono{font:16px "DejaVu Sans Mono",Consolas,monospace;fill:#111827}.output{font:16px "DejaVu Sans Mono",Consolas,monospace;fill:#991b1b}
      .failure{font:700 19px Inter,Arial,sans-serif;fill:#b91c1c}.lesson{font:700 18px Inter,Arial,sans-serif;fill:#7c2d12}
      .footer{font:15px Inter,Arial,sans-serif;fill:#64748b}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#ffffff"/>
  <text class="title" x="56" y="58">Progressive deployment: failure trajectories</text>

  <!-- Panel 1 -->
  <rect x="42" y="125" width="485" height="690" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text class="panel-title" x="66" y="164">① The next action was too broad</text>
  <rect x="66" y="187" width="437" height="58" rx="10" fill="#fed7aa"/>
  <text class="task" x="84" y="213">Task</text><text class="body" x="134" y="213">Continue after PostgreSQL initialization.</text>
  <text class="body" x="84" y="235">IAM and later external services were absent.</text>

  <rect x="66" y="268" width="437" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text class="label" x="84" y="294">Reason → Act</text>
  <text class="body" x="84" y="319">Use the documented aggregate external installer.</text>
  <text class="mono" x="84" y="346">$ ./install-all.sh</text>

  <rect x="96" y="390" width="407" height="142" rx="9" fill="#fff1f2" stroke="#ef4444" stroke-width="2"/>
  <text class="output" x="114" y="420">Installing Postgres</text>
  <text class="output" x="114" y="446">Error: INSTALLATION FAILED:</text>
  <text class="output" x="114" y="472">cannot re-use a name that is</text>
  <text class="output" x="114" y="498">still in use</text>
  <text class="failure" x="114" y="524">✕ No new component deployed</text>

  <rect x="66" y="565" width="437" height="128" rx="10" fill="#ffedd5"/>
  <text class="lesson" x="84" y="594">Failure mode</text>
  <text class="body" x="84" y="620">The agent chose a valid route, but the wrapper</text>
  <text class="body" x="84" y="644">replayed a component already present in runtime state.</text>
  <text class="body" x="84" y="672">The next action needed child-level granularity.</text>

  <!-- Panel 2 -->
  <rect x="557" y="125" width="485" height="690" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text class="panel-title" x="581" y="164">② The script needed interaction</text>
  <rect x="581" y="187" width="437" height="58" rx="10" fill="#fed7aa"/>
  <text class="task" x="599" y="213">Task</text><text class="body" x="649" y="213">Install IAM/Keycloak.</text>
  <text class="body" x="599" y="235">The hostname was configured; the release was absent.</text>

  <rect x="581" y="268" width="437" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text class="label" x="599" y="294">Reason → Act</text>
  <text class="body" x="599" y="319">Run the repository’s focused IAM child installer.</text>
  <text class="mono" x="599" y="346">$ ./install.sh</text>

  <rect x="611" y="390" width="407" height="142" rx="9" fill="#fff1f2" stroke="#ef4444" stroke-width="2"/>
  <text class="output" x="629" y="420">Command ['./install.sh']</text>
  <text class="output" x="629" y="446">timed out after 1800 seconds</text>
  <text class="output" x="629" y="482">Retry: timed out after 1800 seconds</text>
  <!-- <text class="output" x="629" y="508"></text> -->
  <text class="failure" x="629" y="524">✕ Keycloak was not installed</text>

  <rect x="581" y="565" width="437" height="128" rx="10" fill="#ffedd5"/>
  <text class="lesson" x="599" y="594">Failure mode</text>
  <text class="body" x="599" y="620">Approval started the process, but the harness could</text>
  <text class="body" x="599" y="644">not stream output or supply the script’s stdin answer.</text>
  <text class="body" x="599" y="672">Two silent waits consumed about one hour.</text>

  <!-- Panel 3 -->
  <rect x="1072" y="125" width="500" height="690" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text class="panel-title" x="1096" y="163">③ Search continued without progress</text>
  <rect x="1096" y="202" width="437" height="58" rx="10" fill="#fed7aa"/>
  <text class="task" x="1114" y="228">Task</text><text class="body" x="1164" y="228">Find Kafka’s missing configuration producer.</text>
  <text class="body" x="1114" y="250"><tspan font-family="monospace">ConfigMap/global</tspan> was absent.</text>

  <rect x="1096" y="283" width="437" height="180" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text class="label" x="1114" y="309">Reason → Search → Repeat</text>
  <text class="body" x="1114" y="337">Cycle 5: find the source-supported producer.</text>
  <text class="body" x="1114" y="365">Cycle 9: locate the documented producer.</text>
  <text class="body" x="1114" y="393">Cycle 10: search for ConfigMap creation.</text>
  <text class="body" x="1114" y="430">The wording changed; the information state did not.</text>

  <rect x="1126" y="487" width="407" height="125" rx="9" fill="#fff1f2" stroke="#ef4444" stroke-width="2"/>
  <text class="failure" x="1144" y="522">214 / 239 decisions</text>
  <text class="body" x="1144" y="550">concerned Kafka / the global ConfigMap</text>
  <text class="failure" x="1144" y="585">1,208,434 tokens</text>

  <rect x="1096" y="640" width="437" height="96" rx="10" fill="#ffedd5"/>
  <text class="lesson" x="1114" y="669">Failure mode</text>
  <text class="body" x="1114" y="695">No bounded “not found” transition to ask a human,</text>
  <text class="body" x="1114" y="719">mark the step unresolved, or continue independent work.</text>
</svg>
